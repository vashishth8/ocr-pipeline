repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: mypy-sttl
        name: mypy (sttl)
        entry: python -m mypy src/sttl/benchmark.py src/sttl/gates.py src/sttl/geometry.py src/sttl/jsonio.py src/sttl/metrics.py src/sttl/metrics_cli.py src/sttl/reporting.py src/sttl/text.py src/sttl/version.py sttl_compat.py
        language: system
        pass_filenames: false
        files: ^(src/sttl/(benchmark|gates|geometry|jsonio|metrics|metrics_cli|reporting|text|version)\.py|sttl_compat\.py)$
