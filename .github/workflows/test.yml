name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Type check
        run: >-
          python -m mypy src/sttl/benchmark.py src/sttl/gates.py src/sttl/geometry.py
          src/sttl/jsonio.py src/sttl/metrics.py src/sttl/metrics_cli.py src/sttl/reporting.py
          src/sttl/text.py src/sttl/version.py sttl_compat.py
      - name: Run complete test suite with coverage
        run: python -m coverage run -m pytest
      - name: Report coverage
        run: |
          python -m coverage report
          python -m coverage xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-3.11
          path: coverage.xml
          if-no-files-found: error
